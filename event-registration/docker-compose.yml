# Self-hosted setup: app + PostgreSQL. Put a reverse proxy with HTTPS (Caddy, Traefik, nginx) in front.
# Usage: cp .env.example .env  (fill it in; DATABASE_URL is set below)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventreg
      POSTGRES_USER: eventreg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventreg"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://eventreg:${POSTGRES_PASSWORD}@db:5432/eventreg
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
